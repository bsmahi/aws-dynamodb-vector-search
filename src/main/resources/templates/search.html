<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ArXiv Vector Search</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #172033;
            background: #f4f7fb;
        }

        body {
            margin: 0;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
            padding: 48px 20px 64px;
        }

        .hero {
            margin-bottom: 28px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(2rem, 5vw, 3.2rem);
            letter-spacing: -0.04em;
        }

        .subtitle {
            margin: 0;
            color: #64748b;
            font-size: 1.05rem;
        }

        .search-card, .result-card {
            background: #ffffff;
            border: 1px solid #dbe3ef;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(31, 52, 83, 0.06);
        }

        .search-card {
            padding: 22px;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 110px auto;
            gap: 12px;
            align-items: end;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #475569;
            font-size: 0.85rem;
            font-weight: 700;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 12px 13px;
            color: #172033;
            font-size: 1rem;
        }

        input:focus {
            outline: 3px solid rgba(37, 99, 235, 0.18);
            border-color: #2563eb;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 13px 18px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.95rem;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            margin-top: 16px;
            padding: 13px 15px;
            border-radius: 10px;
            background: #fef2f2;
            color: #b91c1c;
        }

        .summary {
            margin: 30px 0 16px;
            color: #475569;
        }

        .results {
            display: grid;
            gap: 16px;
        }

        .result-card {
            padding: 22px;
        }

        .result-heading {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: flex-start;
        }

        h2 {
            margin: 0 0 8px;
            font-size: 1.2rem;
        }

        .score {
            flex: 0 0 auto;
            border-radius: 999px;
            padding: 6px 10px;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 0.85rem;
            font-weight: 800;
        }

        .metadata {
            margin: 0 0 15px;
            color: #64748b;
            font-size: 0.9rem;
        }

        .metadata a {
            color: #2563eb;
            text-decoration: none;
        }

        .abstract {
            margin: 0;
            color: #334155;
            line-height: 1.65;
        }

        @media (max-width: 700px) {
            form {
                grid-template-columns: 1fr;
            }

            .result-heading {
                display: block;
            }

            .score {
                display: inline-block;
                margin-top: 4px;
            }
        }
    </style>
</head>
<body>
<main class="container">
    <header class="hero">
        <h1>ArXiv Vector Search</h1>
        <p class="subtitle">Search paper title and abstract embeddings with Amazon Bedrock and DynamoDB.</p>
    </header>

    <section class="search-card">
        <form method="post" action="/search">
            <div>
                <label for="query">Search query</label>
                <input id="query" name="query" type="text"
                       placeholder="quantum physics and qubit states"
                       th:value="${query}" required>
            </div>
            <div>
                <label for="topK">Top results</label>
                <input id="topK" name="topK" type="number" min="1" max="20"
                       th:value="${topK}">
            </div>
            <button type="submit">Search papers</button>
        </form>
        <div class="error" th:if="${error}" th:text="${error}"></div>
    </section>

    <div class="summary" th:if="${results != null}">
        <strong th:text="${results.size() + ' papers found'}">0 papers found</strong>
        <span> · </span>
        <span th:text="${'Latency: ' + #numbers.formatDecimal(elapsedSeconds, 1, 2) + 's'}">Latency: 0.00s</span>
        <span> · Search Bytes: N/A</span>
    </div>

    <section class="results" th:if="${results != null and !results.isEmpty()}">
        <article class="result-card" th:each="result, status : ${results}">
            <div class="result-heading">
                <h2 th:text="${status.count + '. ' + result.title}">1. Paper title</h2>
                <span class="score" th:text="${'Similarity: ' + #numbers.formatDecimal(result.score, 1, 4)}">Similarity: 0.0000</span>
            </div>
            <p class="metadata">
                <span th:text="${result.authors}">Unknown Authors</span>
                <span th:if="${!result.paperId.isBlank()}">
                    · <a th:href="${'https://arxiv.org/abs/' + result.paperId}"
                         th:text="${'arXiv:' + result.paperId}"
                         target="_blank" rel="noopener">arXiv:paper-id</a>
                </span>
            </p>
            <p class="abstract" th:text="${result.abstractText}">No abstract available.</p>
        </article>
    </section>

    <p class="summary" th:if="${results != null and results.isEmpty()}">
        No results found for this query.
    </p>
</main>
</body>
</html>
